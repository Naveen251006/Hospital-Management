{% extends "base.html" %}
{% block title %}System Error (500){% endblock %}

{% block content %}
<div class="text-center py-5">
  <div class="display-1 fw-bold text-danger mb-3">500</div>
  <h2 class="fw-bold text-dark mb-2">Internal Server Error</h2>
  <p class="text-muted mb-4">An unexpected system condition occurred. The active database transaction was safely rolled back.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn-primary-custom">
    <i class="bi bi-house-door"></i> Return to Dashboard
  </a>
</div>
{% endblock %}
